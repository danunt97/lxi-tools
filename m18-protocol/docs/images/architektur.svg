<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #23262a; stroke: #4a4f57; stroke-width: 1.5; }
    .acc { fill: #2b1418; stroke: #e4002b; stroke-width: 2; }
    .esp { fill: #13233a; stroke: #5aa2ff; stroke-width: 2; }
    .pc  { fill: #12291d; stroke: #3fcf7f; stroke-width: 2; }
    .t   { fill: #eceef0; font-size: 17px; font-weight: 600; }
    .s   { fill: #a5abb3; font-size: 13px; }
    .l   { fill: none; stroke-width: 2.5; }
    .lab { fill: #c9ced4; font-size: 12.5px; }
  </style>
  <rect width="1000" height="420" rx="14" fill="#1b1d20"/>

  <!-- battery -->
  <rect class="acc" x="30" y="150" width="170" height="120" rx="12"/>
  <text class="t" x="115" y="190" text-anchor="middle">M18-Akku</text>
  <text class="s" x="115" y="214" text-anchor="middle">J1 · J2 · B−</text>
  <text class="s" x="115" y="236" text-anchor="middle">Register, Zähler,</text>
  <text class="s" x="115" y="254" text-anchor="middle">Zellspannungen</text>

  <!-- level shifter -->
  <rect class="box" x="250" y="175" width="120" height="70" rx="10"/>
  <text class="t" x="310" y="206" text-anchor="middle" style="font-size:15px">Pegelwandler</text>
  <text class="s" x="310" y="228" text-anchor="middle">3,3 V ↔ J2</text>
  <line class="l" x1="200" y1="210" x2="250" y2="210" stroke="#e4002b"/>

  <!-- ESP32 -->
  <rect class="esp" x="420" y="120" width="230" height="180" rx="12"/>
  <text class="t" x="535" y="155" text-anchor="middle">ESP32-S3 Akku-Brücke</text>
  <text class="s" x="535" y="182" text-anchor="middle">liest den Akku selbst aus</text>
  <text class="s" x="535" y="202" text-anchor="middle">Weboberfläche · WLAN-Einrichtung</text>
  <text class="s" x="535" y="222" text-anchor="middle">Messungen im Flash speichern</text>
  <text class="s" x="535" y="242" text-anchor="middle">Status-LED · Passwortschutz</text>
  <text class="s" x="535" y="262" text-anchor="middle">Firmware-Update im Browser</text>
  <text class="s" x="535" y="282" text-anchor="middle">UDP-Suche + mDNS</text>
  <line class="l" x1="370" y1="210" x2="420" y2="210" stroke="#5aa2ff"/>
  <text class="lab" x="395" y="198" text-anchor="middle">UART</text>

  <!-- phone -->
  <rect class="box" x="455" y="20" width="160" height="62" rx="12"/>
  <text class="t" x="535" y="47" text-anchor="middle" style="font-size:15px">📱 Handy / Browser</text>
  <text class="s" x="535" y="68" text-anchor="middle">beim Kunden, ohne PC</text>
  <line class="l" x1="535" y1="82" x2="535" y2="120" stroke="#5aa2ff" stroke-dasharray="6 5"/>
  <text class="lab" x="545" y="106">WLAN</text>

  <!-- PC -->
  <rect class="pc" x="730" y="100" width="240" height="220" rx="12"/>
  <text class="t" x="850" y="135" text-anchor="middle">PC: Akku-Verwaltung</text>
  <text class="s" x="850" y="160" text-anchor="middle">python gui/m18_gui.py</text>
  <text class="s" x="850" y="188" text-anchor="middle">SQLite-Datenbank</text>
  <text class="s" x="850" y="208" text-anchor="middle">Flotte · Alterung · Warnungen</text>
  <text class="s" x="850" y="228" text-anchor="middle">QR-Etiketten · Berichte · CSV</text>
  <text class="s" x="850" y="248" text-anchor="middle">Messungen der Brücke übernehmen</text>
  <text class="s" x="850" y="276" text-anchor="middle">Browser: http://127.0.0.1:8018</text>
  <line class="l" x1="650" y1="190" x2="730" y2="190" stroke="#3fcf7f"/>
  <text class="lab" x="690" y="180" text-anchor="middle">WLAN</text>
  <line class="l" x1="650" y1="235" x2="730" y2="235" stroke="#3fcf7f" stroke-dasharray="6 5"/>
  <text class="lab" x="690" y="255" text-anchor="middle">oder USB</text>

  <!-- classic adapter path -->
  <rect class="box" x="250" y="335" width="400" height="56" rx="10"/>
  <text class="t" x="450" y="360" text-anchor="middle" style="font-size:14.5px">alternativ: 3,3-V-USB-Seriell-Adapter (m18.py)</text>
  <text class="s" x="450" y="380" text-anchor="middle">wie im ursprünglichen m18-protocol</text>
  <path class="l" d="M115 270 V363 H250" stroke="#959ba3" stroke-dasharray="4 5"/>
  <path class="l" d="M650 363 H850 V320" stroke="#959ba3" stroke-dasharray="4 5"/>
</svg>

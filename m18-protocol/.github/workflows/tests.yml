name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }} (GUI, Brücke, Simulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pyserial (für den USB-Test der Brücke)
        run: pip install pyserial==3.5
      - name: GUI / Datenbank / QR
        run: python -m unittest discover -s gui/tests -v
      - name: Brücken-Protokoll (C++-Selbsttest mit simuliertem Akku)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I esp32-bridge/m18_bridge esp32-bridge/test/sim_bridge.cpp -o sim_bridge
          ./sim_bridge test
      - name: Brücke Ende-zu-Ende (USB, WLAN, Verlauf, Passwort)
        run: python -m unittest esp32-bridge/test/test_bridge.py esp32-bridge/test/test_history.py -v

  firmware:
    name: Firmware ESP32-S3 (Arduino-ESP32 ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.0.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: |
            - esp32-bridge/m18_bridge
          enable-warnings-report: true
          cli-compile-flags: |
            - --warnings
            - default
